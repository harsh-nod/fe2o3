[package]
name = "fe2o3-verifier-integration"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["fast", "rand_core", "zeroize"] }
fe2o3-compiler-lineage = { path = "../../../crates/fe2o3-compiler-lineage" }
fe2o3-functional-proof = { path = "../../../crates/fe2o3-functional-proof", features = ["internal-proof-staging"] }
fe2o3-kernel-ir = { path = "../../../crates/fe2o3-kernel-ir" }
fe2o3-lower-mir-kernel = { path = "../../../crates/fe2o3-lower-mir-kernel" }
fe2o3-mir-model = { path = "../../../crates/fe2o3-mir-model" }
fe2o3-pliron = { path = "../../../crates/fe2o3-pliron", features = ["internal-proof-staging"] }
fe2o3-proof-contracts = { path = "../../../crates/fe2o3-proof-contracts" }
fe2o3-verifier = { path = "../../../crates/fe2o3-verifier" }
sha2 = "0.10"

[workspace]
