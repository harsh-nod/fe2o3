name: S09 gfx942 source debug evidence

on:
  workflow_dispatch:
    inputs:
      confirm_hardware_debug:
        description: Confirm this run may compile and debug kernels on gfx942
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: s09-debug-${{ github.ref }}
  cancel-in-progress: false

jobs:
  s09-debug:
    if: ${{ inputs.confirm_hardware_debug }}
    name: Direct LLVM/LLD and ROCgdb evidence
    runs-on: [self-hosted, linux, x64, rocm, amd-gpu]
    environment: gpu-hardware
    timeout-minutes: 120
    env:
      FE2O3_ALLOW_S09_DEBUG: '1'
      FE2O3_LLVM_LINK_WORKER: ${{ vars.FE2O3_LLVM_LINK_WORKER }}
      FE2O3_LLVM_LINK_WORKER_BUILD_ID: ${{ vars.FE2O3_LLVM_LINK_WORKER_BUILD_ID }}
      FE2O3_LLVM_BUILD_ID: ${{ vars.FE2O3_LLVM_BUILD_ID }}
      FE2O3_S09_EVIDENCE_DIR: ${{ runner.temp }}/fe2o3-s09-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Compile and inspect the fixed S09 profile
        run: scripts/ci-local.sh s09-debug-hardware

      - name: Upload S09 inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: s09-source-debug-evidence
          path: ${{ env.FE2O3_S09_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 7
