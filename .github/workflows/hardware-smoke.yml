name: AMD GPU hardware smoke

on:
  workflow_dispatch:
    inputs:
      confirm_hardware:
        description: Confirm this run may create KFD memory and queue resources
        required: true
        default: false
        type: boolean
      target:
        description: KFD admission target (currently gfx942)
        required: true
        default: gfx942
        type: string

permissions:
  contents: read

concurrency:
  group: hardware-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    if: ${{ inputs.confirm_hardware }}
    name: Validate KFD resources on every GPU
    runs-on: [self-hosted, linux, x64, rocm, amd-gpu]
    environment: gpu-hardware
    timeout-minutes: 120
    env:
      FE2O3_ALLOW_GPU_SMOKE: '1'
      FE2O3_TARGET: ${{ inputs.target }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run guarded KFD hardware suite
        run: scripts/ci-local.sh hardware-smoke

      - name: Upload smoke failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hardware-smoke-artifacts
          path: |
            target/ci-logs/
            target/fe2o3/
          if-no-files-found: ignore
          retention-days: 7
