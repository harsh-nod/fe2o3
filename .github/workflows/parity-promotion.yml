name: Protected parity promotion

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - docs/cuda-oxide-parity-status.tsv
      - docs/cuda-oxide-parity-matrix.md
      - docs/generated/cuda-oxide-parity-dashboard.md
      - docs/generated/cuda-oxide-parity-dashboard.tsv
      - docs/generated/cuda-oxide-parity-signed-promotions.tsv
      - docs/parity-signed-evidence-v2.md
      - docs/parity-row-evidence-policy-v2.tsv
      - docs/parity-evidence/archive/**
      - docs/parity-evidence/trust-policy-v2.example.tsv
      - docs/parity-evidence/trust-policy-v2.tsv
      - docs/parity-evidence/trusted-keys/**
      - scripts/parity-signed-evidence.py
      - scripts/parity-protected-change-policy.sh
      - scripts/parity-dashboard.sh
      - scripts/parity-matrix.sh
      - scripts/parity-promotion-projections.sh
      - scripts/tests/hosted-parity-ci.sh
      - scripts/tests/parity-dashboard.sh
      - scripts/tests/parity-promotion-projections.sh
      - scripts/tests/parity-row-evidence.sh
      - .github/workflows/ci.yml
      - .github/workflows/parity-promotion.yml
      - .github/CODEOWNERS
      - .github/parity-trust-reviewers.txt
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: parity-promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Protected signed-evidence gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Fetch exact protected and candidate revisions
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          [[ "${BASE_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]]
          [[ "${BASE_REF}" == "${DEFAULT_BRANCH}" ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${BASE_SHA}" =~ ^0{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ && ! "${HEAD_SHA}" =~ ^0{40}$ ]]
          git check-ref-format "refs/heads/${BASE_REF}" >/dev/null
          git check-ref-format "refs/heads/${HEAD_REF}" >/dev/null

          REVISION_REPOSITORY="${RUNNER_TEMP}/parity-revisions.git"
          git init --bare "${REVISION_REPOSITORY}"
          auth_header="$(
            printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n'
          )"
          git -C "${REVISION_REPOSITORY}" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --force \
            "https://github.com/${BASE_REPOSITORY}.git" \
            "+refs/heads/${BASE_REF}:refs/parity/base"
          git -C "${REVISION_REPOSITORY}" \
            -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth_header}" \
            fetch --no-tags --force \
            "https://github.com/${HEAD_REPOSITORY}.git" \
            "+refs/heads/${HEAD_REF}:refs/parity/head"
          unset auth_header
          FETCHED_BASE_SHA="$(git -C "${REVISION_REPOSITORY}" \
            rev-parse --verify 'refs/parity/base^{commit}')"
          FETCHED_HEAD_SHA="$(git -C "${REVISION_REPOSITORY}" \
            rev-parse --verify 'refs/parity/head^{commit}')"
          if [[ "${FETCHED_BASE_SHA}" != "${BASE_SHA}" ]]; then
            printf 'pull request base SHA is not current default tip\n' >&2
            exit 2
          fi
          if [[ "${FETCHED_HEAD_SHA}" != "${HEAD_SHA}" ]]; then
            printf 'pull request head changed after event delivery\n' >&2
            exit 2
          fi
          [[ "$(git -C "${REVISION_REPOSITORY}" cat-file -t "${BASE_SHA}")" == commit ]]
          [[ "$(git -C "${REVISION_REPOSITORY}" cat-file -t "${HEAD_SHA}")" == commit ]]
          git -C "${REVISION_REPOSITORY}" worktree add --detach \
            "${GITHUB_WORKSPACE}/protected" "${BASE_SHA}"
          git -C "${REVISION_REPOSITORY}" worktree add --detach \
            "${GITHUB_WORKSPACE}/candidate" "${HEAD_SHA}"
          printf 'REVISION_REPOSITORY=%s\n' "${REVISION_REPOSITORY}" >>"${GITHUB_ENV}"

      - name: Classify protected changes and verify signed promotion
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          reviews="${RUNNER_TEMP}/parity-pr-reviews.json"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100" |
            jq -s 'add' >"${reviews}"
          mode="$(bash protected/scripts/parity-protected-change-policy.sh \
            protected candidate docs/cuda-oxide-parity-status.tsv \
            "${reviews}" protected/.github/parity-trust-reviewers.txt \
            "${REVISION_REPOSITORY}" "${BASE_SHA}" "${HEAD_SHA}" \
            pull-request)"

          case "${mode}" in
            no-op)
              printf 'no parity promotion or trust change\n'
              exit 0
              ;;
            trust-change-approved)
              python3 protected/scripts/parity-signed-evidence.py check-trust-update \
                --protected-root protected \
                --protected-policy protected/docs/parity-evidence/trust-policy-v2.tsv \
                --candidate-root candidate \
                --candidate-policy candidate/docs/parity-evidence/trust-policy-v2.tsv \
                --protected-row-policy protected/docs/parity-row-evidence-policy-v2.tsv \
                --candidate-row-policy candidate/docs/parity-row-evidence-policy-v2.tsv
              printf 'separate trust change has designated review approval\n'
              exit 0
              ;;
            promotion)
              ;;
            *)
              printf 'unknown protected change mode: %s\n' "${mode}" >&2
              exit 2
              ;;
          esac

          test -f protected/docs/parity-evidence/trust-policy-v2.tsv
          test -d protected/docs/parity-evidence/trusted-keys
          manifest="$(python3 protected/scripts/parity-signed-evidence.py \
            derive-promotion-manifest \
            --protected-archive protected/docs/parity-evidence/archive \
            --candidate-archive candidate/docs/parity-evidence/archive)"
          transaction="${RUNNER_TEMP}/signed-promotion-transaction.tsv"
          archive_closure="${RUNNER_TEMP}/signed-promotion-archive-closure.tsv"
          python3 protected/scripts/parity-signed-evidence.py gate \
            --repo candidate \
            --archive-root candidate/docs/parity-evidence/archive \
            --trusted-root protected \
            --trust-policy protected/docs/parity-evidence/trust-policy-v2.tsv \
            --manifest "${manifest}" \
            --trusted-policy protected/docs/parity-row-evidence-policy-v2.tsv \
            --candidate-policy candidate/docs/parity-row-evidence-policy-v2.tsv \
            --baseline-status protected/docs/cuda-oxide-parity-status.tsv \
            --candidate-status candidate/docs/cuda-oxide-parity-status.tsv \
            --projection-output "${transaction}" \
            --archive-closure-output "${archive_closure}"
          bash protected/scripts/parity-promotion-projections.sh \
            protected candidate "${transaction}" "${archive_closure}"

          # No candidate executable or workflow content is invoked above.
