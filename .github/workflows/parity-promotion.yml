name: Protected parity promotion

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  merge_group:
    types: [checks_requested]
  workflow_run:
    workflows: [CI, Parity review signal]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: parity-promotion-controller
  cancel-in-progress: false

jobs:
  merge-group-bootstrap:
    name: Unprivileged merge-group notification
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Validate merge-group trigger
        env:
          EVENT_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -Eeuo pipefail
          [[ "${EVENT_SHA}" == "${HEAD_SHA}" ]]
          [[ "${BASE_SHA}" =~ ^[0-9a-f]{40}$ && ! "${BASE_SHA}" =~ ^0{40}$ ]]
          [[ "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ && ! "${HEAD_SHA}" =~ ^0{40}$ ]]
          printf 'protected verification is independently reconciled from the default branch\n'

  verify:
    name: Protected parity verdict controller
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.event == 'merge_group' ||
        github.event.workflow_run.event == 'pull_request_review'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: parity-verdict
    steps:
      - name: Check out protected controller revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: protected-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Mint minimal verdict token
        id: verdict-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PARITY_VERDICT_APP_ID }}
          private-key: ${{ secrets.PARITY_VERDICT_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Reconcile exact event target
        env:
          EVENT_NAME: ${{ github.event_name }}
          READ_TOKEN: ${{ github.token }}
          CHECK_TOKEN: ${{ steps.verdict-token.outputs.token }}
          PROTECTED_SHA: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CI_WORKFLOW_ID: ${{ vars.PARITY_GENERIC_CI_WORKFLOW_ID }}
          EXPECTED_REVIEW_WORKFLOW_ID: ${{ vars.PARITY_REVIEW_SIGNAL_WORKFLOW_ID }}
          EXPECTED_APP_ID: ${{ vars.PARITY_VERDICT_APP_ID }}
          EXPECTED_APP_SLUG: ${{ steps.verdict-token.outputs.app-slug }}
        run: |
          set -Eeuo pipefail
          bash protected-controller/scripts/parity-protected-controller.sh \
            event "${GITHUB_EVENT_PATH}"

  reconcile:
    name: Reconcile active protected parity checks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: parity-verdict
    steps:
      - name: Check out protected controller revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.workflow_sha }}
          path: protected-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Mint minimal verdict token
        id: verdict-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.PARITY_VERDICT_APP_ID }}
          private-key: ${{ secrets.PARITY_VERDICT_APP_PRIVATE_KEY }}
          permission-checks: write

      - name: Reconcile open PRs and active merge groups
        env:
          READ_TOKEN: ${{ github.token }}
          CHECK_TOKEN: ${{ steps.verdict-token.outputs.token }}
          PROTECTED_SHA: ${{ github.workflow_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_CI_WORKFLOW_ID: ${{ vars.PARITY_GENERIC_CI_WORKFLOW_ID }}
          EXPECTED_REVIEW_WORKFLOW_ID: ${{ vars.PARITY_REVIEW_SIGNAL_WORKFLOW_ID }}
          EXPECTED_APP_ID: ${{ vars.PARITY_VERDICT_APP_ID }}
          EXPECTED_APP_SLUG: ${{ steps.verdict-token.outputs.app-slug }}
        run: |
          set -Eeuo pipefail
          bash protected-controller/scripts/parity-protected-controller.sh reconcile
