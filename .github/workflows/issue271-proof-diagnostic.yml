name: Issue 271 Combined Proof Source Ordinary Diagnostic

on:
  push:
    branches: [wip/issue271-guarded-store-byte-diagnostic-v90-r1-20261004]

permissions:
  contents: read

jobs:
  verifier-ordinary:
    name: Exact65658d guarded-store174 ordinary and tested artifact export (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out diagnostic control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 65658d4f47b1d404a2e98a6fb1f92c85142a9e6f
          path: source
          persist-credentials: false
      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm ripgrep
      - name: Install pinned Rust toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Run exact reviewed ordinary roster
        env:
          EXPECTED_CONTROL_HEAD: ${{ github.sha }}
        run: python3 control/.github/diagnostics/issue271-proof-v78.py
      - name: Upload diagnostics and exact tested verifier artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue271-guarded-store-65658d-ordinary-v90-r1-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue271-proof-v78-logs/
          if-no-files-found: warn
          retention-days: 7
