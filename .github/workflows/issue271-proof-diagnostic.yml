name: Issue 271 Combined Proof Source Ordinary Diagnostic

on:
  push:
    branches: [wip/issue271-source-thread-write-diagnostic-v89-r4-20261004]

permissions:
  contents: read

jobs:
  verifier-ordinary:
    name: Exact c54bf2 source-thread-write150 closed-fixture retry (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out diagnostic control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: c54bf2be8454b67b4465e5f702e2d9de6916998d
          path: source
          persist-credentials: false
      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm ripgrep
      - name: Install pinned Rust toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Run exact reviewed ordinary roster
        env:
          EXPECTED_CONTROL_HEAD: ${{ github.sha }}
        run: python3 control/.github/diagnostics/issue271-proof-v78.py
      - name: Upload diagnostics and exact tested verifier artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue271-thread-write-c54bf2-ordinary-v89-r4-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue271-proof-v78-logs/
          if-no-files-found: warn
          retention-days: 7
