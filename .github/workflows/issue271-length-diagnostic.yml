name: Issue 271 SliceLength Diagnostic

on:
  push:
    branches: [wip/issue271-length-diagnostic-v77-20261004]

permissions:
  contents: read

jobs:
  lowerer-ordinary:
    name: Exact d8e6 SliceLength ordinary tests (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out diagnostic control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d8e6ff662f2c5598834a3020ea22ed215da20e14
          path: source
          persist-credentials: false
      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm ripgrep
      - name: Install pinned Rust toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Run exact reviewed ordinary roster
        env:
          EXPECTED_CONTROL_HEAD: ${{ github.sha }}
        run: python3 control/.github/diagnostics/issue271-length-v76.py
      - name: Upload diagnostic logs only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue271-length-d8e6-ordinary-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue271-length-v76-logs/
          if-no-files-found: warn
          retention-days: 7
