name: Tiled GEMM V1 host scaffold

on:
  merge_group:
    types: [checks_requested]
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tiled-gemm-v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof-contract:
    name: Pinned Verus register and LDS proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install exact pinned Verus artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          readonly expected_version="0.2026.08.02.b677dd5"
          readonly expected_archive_sha256="4c769256e888ee84bde85aae44d95c46bccbb8cf70e1d09f537b0d05fe965dee"
          readonly release_url="https://github.com/verus-lang/verus/releases/download/release/0.2026.08.02.b677dd5/verus-0.2026.08.02.b677dd5-x86-linux.zip"
          readonly version_file="examples/tiled_gemm_v1/verus/VERUS_VERSION"
          readonly executable_sha256_file="examples/tiled_gemm_v1/verus/VERUS_SHA256"
          readonly archive="${RUNNER_TEMP}/verus-0.2026.08.02.b677dd5-x86-linux.zip"
          readonly install_dir="${RUNNER_TEMP}/pinned-verus"

          [[ "$(<"${version_file}")" == "${expected_version}" ]]
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            --output "${archive}" "${release_url}"
          printf '%s  %s\n' "${expected_archive_sha256}" "${archive}" \
            | sha256sum --check --strict -
          mkdir -p "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"

          readonly verus="${install_dir}/verus-x86-linux/verus"
          readonly expected_executable_sha256="$(<"${executable_sha256_file}")"
          readonly actual_executable_sha256="$(sha256sum "${verus}" | awk '{print $1}')"
          [[ "${actual_executable_sha256}" == "${expected_executable_sha256}" ]]
          printf 'VERUS=%s\n' "${verus}" >> "${GITHUB_ENV}"

      - name: Verify positive proof and rejected formula mutations
        run: examples/tiled_gemm_v1/run-verus.sh

  host-contract:
    name: Host contract and numerical oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check standalone formatting
        run: >-
          cargo fmt --manifest-path examples/tiled_gemm_v1/Cargo.toml
          --package fe2o3-tiled-gemm-v1 -- --check

      - name: Run debug tests and doctests
        run: cargo test --locked --manifest-path examples/tiled_gemm_v1/Cargo.toml

      - name: Run release tests and doctests
        run: cargo test --release --locked --manifest-path examples/tiled_gemm_v1/Cargo.toml

      - name: Run strict all-target Clippy
        run: >-
          cargo clippy --locked
          --manifest-path examples/tiled_gemm_v1/Cargo.toml
          --all-targets --all-features -- -D warnings
