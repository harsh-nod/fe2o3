name: CI

on:
  merge_group:
    types: [checks_requested]
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Generic validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep

      - name: Gate parity status promotions
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -Eeuo pipefail
          case "${EVENT_NAME}" in
            pull_request)
              BASE_SHA="${PR_BASE_SHA}"
              HEAD_SHA="${EVENT_HEAD_SHA}"
              ;;
            merge_group)
              BASE_SHA="${MERGE_BASE_SHA}"
              HEAD_SHA="${MERGE_HEAD_SHA}"
              ;;
            push)
              HEAD_SHA="${EVENT_HEAD_SHA}"
              if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" ]]; then
                BASE_SHA="${PUSH_BEFORE_SHA}"
              else
                git check-ref-format "refs/heads/${DEFAULT_BRANCH}" >/dev/null || {
                  printf 'invalid default branch ref\n' >&2
                  exit 2
                }
                DEFAULT_REMOTE_REF="refs/remotes/origin/${DEFAULT_BRANCH}"
                git fetch --no-tags --prune --force origin \
                  "+refs/heads/${DEFAULT_BRANCH}:${DEFAULT_REMOTE_REF}"
                BASE_SHA="$(git rev-parse --verify "${DEFAULT_REMOTE_REF}^{commit}")"
              fi
              ;;
            *)
              printf 'unsupported parity trust event: %s\n' "${EVENT_NAME}" >&2
              exit 2
              ;;
          esac
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || "${BASE_SHA}" =~ ^0{40}$ ]]; then
            printf 'missing or zero parity base SHA\n' >&2
            exit 2
          fi
          if [[ ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ || "${HEAD_SHA}" =~ ^0{40}$ ]]; then
            printf 'missing or zero parity head SHA\n' >&2
            exit 2
          fi
          git cat-file -e "${BASE_SHA}^{commit}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          if [[ "${EVENT_NAME}" == push && "${REF_NAME}" != "${DEFAULT_BRANCH}" ]] &&
            ! git merge-base --is-ancestor "${BASE_SHA}" "${HEAD_SHA}"; then
            printf 'non-default branch head does not contain current protected default tip\n' >&2
            exit 2
          fi
          if git diff --quiet "${BASE_SHA}" "${HEAD_SHA}" -- docs/cuda-oxide-parity-status.tsv; then
            exit 0
          fi

          # The verifier, policy, and public keys all come from the protected
          # base. Candidate-owned checksums and candidate verifier changes
          # cannot authorize a promotion.
          archive=docs/parity-evidence/archive
          baseline="${RUNNER_TEMP}/cuda-oxide-parity-status.before.tsv"
          trusted="${RUNNER_TEMP}/protected-parity-evidence"
          mkdir -p "${trusted}"
          git show "${BASE_SHA}:docs/cuda-oxide-parity-status.tsv" >"${baseline}"
          test -d "${archive}"
          test -f "${archive}/manifests/promotion-v2.tsv"
          git archive "${BASE_SHA}" \
            scripts/parity-signed-evidence.py \
            docs/parity-row-evidence-policy-v2.tsv \
            docs/parity-evidence/trust-policy-v2.tsv \
            docs/parity-evidence/trusted-keys |
            tar -x -C "${trusted}"
          python3 "${trusted}/scripts/parity-signed-evidence.py" gate \
            --repo "${GITHUB_WORKSPACE}" \
            --archive-root "${archive}" \
            --trusted-root "${trusted}" \
            --trust-policy "${trusted}/docs/parity-evidence/trust-policy-v2.tsv" \
            --manifest manifests/promotion-v2.tsv \
            --trusted-policy "${trusted}/docs/parity-row-evidence-policy-v2.tsv" \
            --candidate-policy docs/parity-row-evidence-policy-v2.tsv \
            --baseline-status "${baseline}" \
            --candidate-status docs/cuda-oxide-parity-status.tsv

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Record tool versions
        run: |
          rustc -Vv
          cargo -V

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Validate with isolated codegen-backend tests
        run: scripts/ci-local.sh generic

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generic-validation-logs
          path: target/ci-logs/
          if-no-files-found: ignore
          retention-days: 7
