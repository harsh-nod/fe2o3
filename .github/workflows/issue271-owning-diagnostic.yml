name: Issue 271 Actual Source Custody Diagnostic

on:
  push:
    branches: [wip/issue271-owning-diagnostic-v78-20261004]

permissions:
  contents: read

jobs:
  source-owning-parents:
    name: Exact 8a3e5 actual source custody parents (diagnostic only)
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    steps:
      - name: Check out diagnostic control
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Check out exact reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8a3e5eb115ba499a75fbc5df383b2c86c04ab6ec
          path: source
          persist-credentials: false
      - name: Install generic test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes llvm ripgrep
      - name: Install pinned Rust toolchain
        working-directory: source
        run: rustup show active-toolchain
      - name: Run exact reviewed owning parents
        env:
          EXPECTED_CONTROL_HEAD: ${{ github.sha }}
        run: python3 control/.github/diagnostics/issue271-owning-v78.py
      - name: Upload diagnostic logs only
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue271-owning-8a3e5-v79-${{ github.run_attempt }}
          path: ${{ runner.temp }}/issue271-owning-v78-logs/
          if-no-files-found: warn
          retention-days: 7
