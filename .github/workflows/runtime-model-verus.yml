name: Runtime model authenticated Verus

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-model-verus.yml"
      - "crates/fe2o3-runtime-model/**"
      - "crates/fe2o3-kfd/src/sdma.rs"
      - "crates/fe2o3-kfd/src/sdma/compute_xgmi_plan*.rs"
      - "crates/fe2o3-kfd/src/sdma/compute_xgmi_window*.rs"
      - "crates/fe2o3-kernel-analysis/src/gfx942_integer_semantics*"
      - "crates/fe2o3-kernel-analysis/src/gfx942_integer_semantics_v1/**"
      - "crates/fe2o3-kernel-analysis/verus/**"
      - "crates/fe2o3-verifier/src/gfx942_local_checked_u32_add_v1*"
      - "crates/fe2o3-verifier/src/gfx942_local_checked_u32_add_v1/**"
      - "crates/fe2o3-verifier/verus/checked_u32_prefix*"
      - "crates/fe2o3-verifier/verus/checked_u32_normalization_schema.py"
      - "crates/fe2o3-mir-model/src/semantic_mir_v1.rs"
      - "crates/fe2o3-lower-mir-kernel/src/production_semantic_kir_v1.rs"
      - "crates/fe2o3-lower-mir-kernel/src/production_checked_u32_add_capture_v1.rs"
      - "crates/fe2o3-verifier/verus/run-checked-u32-prefix.sh"
      - "examples/row_softmax_v1/verify-verus-closure.sh"
      - "examples/wave64_collectives_v1/check-proof-source.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/runtime-model-verus.yml"
      - "crates/fe2o3-runtime-model/**"
      - "crates/fe2o3-kfd/src/sdma.rs"
      - "crates/fe2o3-kfd/src/sdma/compute_xgmi_plan*.rs"
      - "crates/fe2o3-kfd/src/sdma/compute_xgmi_window*.rs"
      - "crates/fe2o3-kernel-analysis/src/gfx942_integer_semantics*"
      - "crates/fe2o3-kernel-analysis/src/gfx942_integer_semantics_v1/**"
      - "crates/fe2o3-kernel-analysis/verus/**"
      - "crates/fe2o3-verifier/src/gfx942_local_checked_u32_add_v1*"
      - "crates/fe2o3-verifier/src/gfx942_local_checked_u32_add_v1/**"
      - "crates/fe2o3-verifier/verus/checked_u32_prefix*"
      - "crates/fe2o3-verifier/verus/checked_u32_normalization_schema.py"
      - "crates/fe2o3-mir-model/src/semantic_mir_v1.rs"
      - "crates/fe2o3-lower-mir-kernel/src/production_semantic_kir_v1.rs"
      - "crates/fe2o3-lower-mir-kernel/src/production_checked_u32_add_capture_v1.rs"
      - "crates/fe2o3-verifier/verus/run-checked-u32-prefix.sh"
      - "examples/row_softmax_v1/verify-verus-closure.sh"
      - "examples/wave64_collectives_v1/check-proof-source.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-model-verus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authenticated-runtime-model:
    name: Device identity and lifecycle proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Verus Rust toolchain
        run: >-
          rustup toolchain install 1.97.1-x86_64-unknown-linux-gnu
          --profile minimal --no-self-update

      - name: Install pinned Verus closure
        shell: bash
        run: |
          set -Eeuo pipefail
          readonly version="0.2026.08.09.92f466f"
          readonly archive="${RUNNER_TEMP}/verus-${version}-x86-linux.zip"
          readonly install_dir="${RUNNER_TEMP}/pinned-verus"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${archive}" \
            "https://github.com/verus-lang/verus/releases/download/release/${version}/verus-${version}-x86-linux.zip"
          mkdir -- "${install_dir}"
          unzip -q "${archive}" -d "${install_dir}"
          printf 'VERUS=%s\n' "${install_dir}/verus-x86-linux/verus" >> "${GITHUB_ENV}"

      - name: Verify authenticated runtime model
        run: crates/fe2o3-runtime-model/verus/verify-verus.sh

      - name: Verify shared gfx942 MOV/ADD state, composition and negative controls
        run: bash crates/fe2o3-kernel-analysis/verus/run-gfx942-add-u32.sh

      - name: Verify shared checked-u32 source normalization, basis/fold and negative controls
        run: bash crates/fe2o3-verifier/verus/run-checked-u32-prefix.sh

      - name: Verify shared native peer window arithmetic and negative controls
        run: bash crates/fe2o3-runtime-model/verus/run-compute-xgmi-window.sh
