[package]
name = "fe2o3-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
description = "Bounded, deterministic verifier-driver records for fe2o3"
publish = false

[lib]
name = "fe2o3_verifier"

[dependencies]
fe2o3-artifact-transaction.workspace = true
fe2o3-artifacts.workspace = true
fe2o3-contracts.workspace = true
fe2o3-kernel-descriptor.workspace = true
fe2o3-rustc-front.workspace = true
proc-macro2.workspace = true
syn.workspace = true
toml = "1.1.4"

[[bin]]
name = "fe2o3-verifier-test-recorder"
path = "tests/support/recorder.rs"
test = false
