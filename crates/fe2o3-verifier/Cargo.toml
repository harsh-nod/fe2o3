[package]
name = "fe2o3-verifier"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
description = "Bounded, deterministic verifier-driver records for fe2o3"
publish = false

[lib]
name = "fe2o3_verifier"

[dependencies]
dialect-kernel.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-artifacts.workspace = true
fe2o3-contracts.workspace = true
fe2o3-compiler-lineage.workspace = true
fe2o3-functional-proof = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-kernel-descriptor.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-pliron = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-proof-contracts.workspace = true
fe2o3-rustc-front.workspace = true
proc-macro2.workspace = true
rustix.workspace = true
sha2.workspace = true
syn = { workspace = true, features = ["visit"] }
toml = "1.1.4"
ed25519-dalek = { version = "2.2.0", features = ["fast", "rand_core", "zeroize"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[[bin]]
name = "fe2o3-verifier-test-recorder"
path = "tests/support/recorder.rs"
test = false

[[bin]]
name = "fe2o3-verus-execution-v2-fixture"
path = "tests/support/verus_execution_v2.rs"
test = false
