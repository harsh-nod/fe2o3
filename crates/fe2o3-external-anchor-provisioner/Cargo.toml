[package]
name = "fe2o3-external-anchor-provisioner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Measured root-to-service provisioning for the fe2o3 external anchor."
publish = false

[dependencies]
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-external-anchor-service.workspace = true
fe2o3-protected-service-profile.workspace = true
fe2o3-protected-static-executable.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["process", "thread"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-runtime-protocol.workspace = true
sha2.workspace = true
tempfile = "=3.21.0"

[lints.rust]
unsafe_code = "deny"

[[bin]]
name = "fe2o3-external-anchor-provisioning-helper"
path = "src/main.rs"
test = false
bench = false
