[package]
name = "fe2o3-host"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Host-side launch helpers for fe2o3."

[features]
hardware-test-hooks = ["dep:rmpv", "fe2o3-artifact-transaction/test-hooks"]
worker-v3-verifier-test-support = []

[dependencies]
fe2o3-aql.workspace = true
fe2o3-amd-target.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-artifacts.workspace = true
fe2o3-core.workspace = true
fe2o3-compiler-ffi.workspace = true
fe2o3-device.workspace = true
fe2o3-hsaco.workspace = true
fe2o3-hsaco-finalize.workspace = true
fe2o3-kernel-descriptor.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-kfd.workspace = true
fe2o3-runtime.workspace = true
fe2o3-runtime-protocol.workspace = true
libc.workspace = true
reserved-fe2o3-symbols.workspace = true
rmpv = { version = "1.3.1", default-features = false, optional = true }
rustix.workspace = true
sha2.workspace = true

[dev-dependencies]
fe2o3-artifact-transaction = { workspace = true, features = ["test-hooks"] }
fe2o3-core.workspace = true
fe2o3-rustc-invocation.workspace = true
rmpv = { version = "1.3.1", default-features = false }
serde = "1"
serde_json = "1"
trybuild = "1"

[lib]
name = "fe2o3_host"
