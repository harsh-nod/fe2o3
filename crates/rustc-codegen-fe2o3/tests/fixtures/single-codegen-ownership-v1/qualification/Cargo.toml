[package]
name = "fe2o3-single-codegen-ownership-qualification"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-artifact-transaction = { path = "../../../../../fe2o3-artifact-transaction" }
fe2o3-build-authority = { path = "../../../../../fe2o3-build-authority" }
fe2o3-compiler-closure-capability = { path = "../../../../../fe2o3-compiler-closure-capability" }
fe2o3-compiler-execution-client = { path = "../../../../../fe2o3-compiler-execution-client", features = ["test-support"] }
fe2o3-compiler-execution-protocol = { path = "../../../../../fe2o3-compiler-execution-protocol" }
fe2o3-compiler-ffi = { path = "../../../../../fe2o3-compiler-ffi" }
fe2o3-hsaco-finalize = { path = "../../../../../fe2o3-hsaco-finalize" }
fe2o3-process-identity = { path = "../../../../../fe2o3-process-identity" }
fe2o3-rustc-invocation = { path = "../../../../../fe2o3-rustc-invocation" }
libc = "0.2"
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core"] }
sha2 = "0.11.0"

[[test]]
name = "single_codegen_ownership_v1"
path = "../../../single_codegen_ownership_v1.rs"
