[package]
name = "fe2o3-trusted-item-local-marker"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
duplicate-genuine = ["dep:fe2o3-device-real"]
reserved-capability-spoof = []
reserved-capability-control = []
workgroup-provider-spoof = ["reserved-capability-control"]
workgroup-provider-control = ["reserved-capability-control"]

[dependencies]
fe2o3-device-real = { package = "fe2o3-device", path = "../../../../fe2o3-device", optional = true }

[lib]
path = "src/main.rs"
