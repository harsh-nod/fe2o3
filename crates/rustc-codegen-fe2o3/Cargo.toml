[package]
name = "rustc-codegen-fe2o3"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compiler backend support code for fe2o3."
build = "build.rs"

[dependencies]
dialect-amdgcn.workspace = true
dialect-gpu.workspace = true
dialect-kernel.workspace = true
dialect-mir = { workspace = true, features = ["pliron"] }
fe2o3-amd-target.workspace = true
fe2o3-artifacts.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-build-authority.workspace = true
fe2o3-compiler-api.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-client.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-compiler-ffi.workspace = true
fe2o3-compiler-lineage.workspace = true
fe2o3-kernel-descriptor.workspace = true
fe2o3-kernel-analysis = { workspace = true, features = [
    "authenticated-machine-effect",
    "pliron-analysis",
] }
fe2o3-kernel-ir.workspace = true
fe2o3-lower-mir-kernel.workspace = true
fe2o3-mir-model.workspace = true
fe2o3-pliron.workspace = true
fe2o3-functional-proof.workspace = true
fe2o3-proof-contracts.workspace = true
fe2o3-process-identity.workspace = true
fe2o3-rustc-front.workspace = true
fe2o3-rustc-invocation.workspace = true
fe2o3-verifier.workspace = true
libc.workspace = true
reserved-fe2o3-symbols.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
pliron.workspace = true

[dev-dependencies]
fe2o3-hsaco.workspace = true
fe2o3-hsaco-finalize.workspace = true
fe2o3-host.workspace = true
fe2o3-kir-sim-cli.workspace = true
fe2o3-runtime.workspace = true
fe2o3-sim-differential.workspace = true
fe2o3-sim-runtime.workspace = true
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core"] }
rmpv = { version = "1.3.1", default-features = false }

[lib]
name = "rustc_codegen_fe2o3"
crate-type = ["rlib", "dylib"]

[[bin]]
name = "fe2o3-rustc-extract"
path = "src/bin/fe2o3-rustc-extract.rs"

[[bin]]
name = "fe2o3-export-sim"
path = "src/bin/fe2o3-export-sim.rs"

[[test]]
name = "production_extraction_driver_v1"

[[test]]
name = "production_general_matrix_driver_v1"

[[test]]
name = "production_ranked_bounds_driver_v1"

[[test]]
name = "production_semantic_conformance_v3"

[[test]]
name = "reference_binding_v1"

[[test]]
name = "cross_crate_typed_binding"

[package.metadata.rust-analyzer]
rustc_private = true
