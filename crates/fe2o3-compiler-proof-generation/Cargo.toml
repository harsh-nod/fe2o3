[package]
name = "fe2o3-compiler-proof-generation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Compiler-owned Pliron proof generation for fe2o3"
publish = false

[dependencies]
ed25519-dalek = { version = "2.2.0", features = ["fast", "rand_core", "zeroize"] }
fe2o3-functional-proof = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-pliron = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-proof-contracts.workspace = true
fe2o3-verifier.workspace = true
rand_core = { version = "0.6", features = ["getrandom"] }
sha2.workspace = true

[lib]
name = "fe2o3_compiler_proof_generation"
