[package]
name = "fe2o3-hsaco"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded, read-only HSACO metadata inspection for fe2o3."
publish = false

[lib]
name = "fe2o3_hsaco"

[dependencies]
fe2o3-amd-target.workspace = true
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core"] }
rmpv = { version = "1.3.1", default-features = false }
