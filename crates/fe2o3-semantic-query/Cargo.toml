fe2o3-source-isa-observation.workspace = true
serde.workspace = true
serde_json = "1"
sha2.workspace = true

[dev-dependencies]
rmpv = { version = "1.3.1", default-features = false }

[[bin]]
name = "fe2o3-trace-query"
path = "src/main.rs"
