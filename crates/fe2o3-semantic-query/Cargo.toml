[package]
name = "fe2o3-semantic-query"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded read-only debugger and profiler queries over fe2o3 semantic evidence."

[dependencies]
fe2o3-hsaco.workspace = true
fe2o3-hsaco-finalize.workspace = true
fe2o3-profiler-protocol.workspace = true
fe2o3-runtime.workspace = true
