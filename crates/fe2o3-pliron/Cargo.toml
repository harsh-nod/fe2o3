[package]
name = "fe2o3-pliron"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded, non-authoritative Pliron context and pass-planning shell for fe2o3."
readme = "README.md"
publish = false

[features]
default = []
internal-test-context-access = []

[dependencies]
dialect-gpu.workspace = true
dialect-kernel.workspace = true
dialect-mir = { workspace = true, features = ["pliron"] }
fe2o3-kernel-analysis = { workspace = true, features = ["pliron-analysis"] }
fe2o3-mir-model.workspace = true
fe2o3-pliron-owner-core.workspace = true
pliron.workspace = true
sha2.workspace = true

[dev-dependencies]
trybuild = "1"
