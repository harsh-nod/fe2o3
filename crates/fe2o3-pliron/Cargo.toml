[package]
name = "fe2o3-pliron"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Owner-aware Pliron context, typed KIR bridge, and closed optimization executor for fe2o3."
readme = "README.md"
publish = false

[features]
default = []
internal-test-context-access = []
# Exposes policy-checked receipt staging to the workspace verifier and hostile
# tests. The staged graph remains non-authoritative until aggregate replay.
internal-proof-staging = ["fe2o3-functional-proof/internal-proof-staging"]

[dependencies]
dialect-gpu.workspace = true
dialect-kernel.workspace = true
dialect-mir = { workspace = true, features = ["pliron"] }
dialect-proof.workspace = true
fe2o3-functional-proof.workspace = true
fe2o3-kernel-analysis = { workspace = true, features = ["pliron-analysis"] }
fe2o3-kernel-ir.workspace = true
fe2o3-mir-model.workspace = true
fe2o3-pliron-owner-core.workspace = true
fe2o3-proof-contracts.workspace = true
pliron.workspace = true
sha2.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", features = ["fast", "zeroize"] }
trybuild = "1"
