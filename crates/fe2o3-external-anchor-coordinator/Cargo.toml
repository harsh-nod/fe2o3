[package]
name = "fe2o3-external-anchor-coordinator"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Root-owned lifecycle coordinator for the fe2o3 external anchor."
publish = false

[dependencies]
fe2o3-artifact-transaction.workspace = true
fe2o3-broker-authority-service.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-external-anchor-provisioner.workspace = true
fe2o3-protected-service-profile.workspace = true
fe2o3-protected-service-spawn.workspace = true
fe2o3-protected-static-executable.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["event", "pipe", "process", "thread"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-broker-authority-service = { workspace = true, features = ["test-support"] }
fe2o3-external-anchor-protocol.workspace = true
fe2o3-protected-service-spawn = { workspace = true, features = ["test-support"] }
sha2.workspace = true
tempfile = "=3.21.0"

[lints.rust]
unsafe_code = "deny"
