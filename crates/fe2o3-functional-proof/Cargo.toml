[package]
name = "fe2o3-functional-proof"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Workload-neutral authenticated functional-refinement proof receipts for fe2o3."
readme = "README.md"
publish = false

[features]
default = []
# Low-level receipt construction/import for the workspace verifier and hostile tests.
# Enabling this feature grants no compiler or artifact authority.
internal-proof-staging = []

[dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-proof-contracts.workspace = true
sha2.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", features = ["rand_core"] }

[lints.rust]
unsafe_code = "forbid"
