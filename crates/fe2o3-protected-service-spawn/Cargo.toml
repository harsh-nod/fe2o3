[package]
name = "fe2o3-protected-service-spawn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Root-owned exact protected-service spawn and pidfd custody for fe2o3."
publish = false

[features]
test-support = []

[[bin]]
name = "fe2o3-proof-controller-profile-fixture"
path = "src/bin/proof_controller_profile_fixture.rs"
required-features = ["test-support"]
test = false
bench = false

[dependencies]
fe2o3-artifact-transaction.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-protected-service-profile.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["event", "pipe", "process", "thread"] }

[dev-dependencies]
tempfile = "=3.21.0"
rustix = { workspace = true, features = ["net", "event"] }

[lints.rust]
unsafe_code = "deny"
