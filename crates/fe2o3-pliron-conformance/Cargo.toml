[package]
name = "fe2o3-pliron-conformance"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Integration and conformance tests for bounded fe2o3 Pliron boundaries."
readme = "README.md"
publish = false

[dev-dependencies]
dialect-autotune.workspace = true
dialect-dispatch.workspace = true
dialect-gpu.workspace = true
dialect-kernel.workspace = true
dialect-mir = { workspace = true, features = ["pliron"] }
dialect-proof.workspace = true
dialect-schedule.workspace = true
dialect-tile.workspace = true
fe2o3-lower-mir-kernel.workspace = true
fe2o3-pliron = { workspace = true, features = ["internal-test-context-access"] }
pliron.workspace = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"
