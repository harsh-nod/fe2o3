[package]
name = "fe2o3-compiler-execution-supervisor"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Protected compiler-execution issuer supervision for fe2o3."
publish = false

[dependencies]
fe2o3-artifact-transaction.workspace = true
fe2o3-broker-authority-service.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-issuer.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-runtime-protocol.workspace = true
fe2o3-static-preexec-manifest.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["event", "pipe", "process", "thread"] }
sha2.workspace = true

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-compiler-execution-client = { workspace = true, features = ["test-support"] }

[lints.rust]
unsafe_code = "deny"
