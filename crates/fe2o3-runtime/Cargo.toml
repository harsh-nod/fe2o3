[package]
name = "fe2o3-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Sole safe composition boundary for the pure-Rust fe2o3 GPU runtime."
publish = false

[lib]
name = "fe2o3_runtime"

[features]
default = []
# Unsafe, exact-artifact hardware diagnosis only. This grants no Worker V3 authority.
hardware-diagnostic = []

[[example]]
name = "gfx942-lds-diagnostic"
required-features = ["hardware-diagnostic"]

[dependencies]
fe2o3-amdhsa-loader.workspace = true
fe2o3-aql.workspace = true
fe2o3-hsaco.workspace = true
fe2o3-host-api.workspace = true
fe2o3-kfd.workspace = true
fe2o3-runtime-model.workspace = true
sha2.workspace = true

[dev-dependencies]
rmpv = { version = "1.3.1", default-features = false }
