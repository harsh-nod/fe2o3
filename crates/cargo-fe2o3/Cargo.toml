[package]
name = "cargo-fe2o3"
version = "0.1.0"
default-run = "cargo-fe2o3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cargo subcommand for fe2o3."

[features]
application-handoff-adversarial-fixture = []
application-handoff-fault-injection-test-only = []
worker-v3-host-consumer-fixture = ["dep:fe2o3-host", "fe2o3-host/hardware-test-hooks"]
worker-v3-envelope-integration-test-only = [
    "application-handoff-adversarial-fixture",
    "application-handoff-fault-injection-test-only",
    "dep:fe2o3-core",
    "dep:fe2o3-hsa-runtime",
    "worker-v3-host-consumer-fixture",
]

[dependencies]
cap-primitives = "=4.0.2"
fe2o3-amd-target.workspace = true
fe2o3-artifacts.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-build-authority.workspace = true
fe2o3-compiler-ffi.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-compiler-execution-client.workspace = true
fe2o3-compiler-execution-protocol.workspace = true
fe2o3-core = { workspace = true, optional = true }
fe2o3-hsa-runtime = { workspace = true, optional = true }
fe2o3-hsaco.workspace = true
fe2o3-hsaco-finalize.workspace = true
fe2o3-host = { workspace = true, optional = true }
fe2o3-kernel-descriptor.workspace = true
fe2o3-process-identity.workspace = true
fe2o3-rustc-invocation.workspace = true
fe2o3-runtime-protocol.workspace = true
libc.workspace = true
proc-macro2.workspace = true
reserved-fe2o3-symbols.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json = "1"
sha2.workspace = true
syn = { workspace = true, features = ["visit"] }

[dev-dependencies]
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-artifact-transaction = { workspace = true, features = ["test-hooks"] }
fe2o3-device.workspace = true

[[bin]]
name = "cargo-fe2o3"
path = "src/main.rs"

[[bin]]
name = "fe2o3-rustc-wrapper"
path = "src/bin/fe2o3-rustc-wrapper.rs"

[[bin]]
name = "fe2o3-worker-v3-hsaco-fixture"
path = "tests/fixtures/worker_v3_hsaco_fixture.rs"
test = false
bench = false
required-features = ["worker-v3-envelope-integration-test-only"]

[[bin]]
name = "cargo-fe2o3-cargo-fixture"
path = "tests/fixtures/cargo_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-release-cargo-fixture"
path = "tests/fixtures/release_cargo_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-rustc-fixture"
path = "tests/fixtures/rustc_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-release-rustc-fixture"
path = "tests/fixtures/release_rustc_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-build-script-fixture"
path = "tests/fixtures/build_script_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-runner-app-fixture"
path = "tests/fixtures/runner_app_fixture.rs"
required-features = ["application-handoff-adversarial-fixture"]
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-runner-chain-fixture"
path = "tests/fixtures/runner_chain_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-worker-v3-host-consumer-app-fixture"
path = "tests/fixtures/worker_v3_host_consumer_app_fixture.rs"
required-features = ["worker-v3-host-consumer-fixture"]
test = false
bench = false
