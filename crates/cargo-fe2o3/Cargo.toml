[package]
name = "cargo-fe2o3"
version = "0.1.0"
default-run = "cargo-fe2o3"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Cargo subcommand for fe2o3."

[features]
compiler-handoff-observation-test-only = []
worker-v2-fault-injection-test-only = []
legacy-hsa-runtime = ["dep:fe2o3-core", "dep:fe2o3-hsa-runtime", "dep:fe2o3-host"]
host-consumer-fixture = ["legacy-hsa-runtime", "fe2o3-host/hardware-test-hooks"]
worker-v3-envelope-integration-test-only = [
    "legacy-hsa-runtime",
    "dep:fe2o3-scalar-gemm-v1",
    "fe2o3-host/hardware-test-hooks",
    "dep:fe2o3-worker-v3-authority",
]

[dependencies]
cap-primitives = "=4.0.2"
fe2o3-artifacts.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-build-authority.workspace = true
fe2o3-compiler-ffi.workspace = true
fe2o3-compiler-closure-capability.workspace = true
fe2o3-core = { workspace = true, optional = true }
fe2o3-hsa-runtime = { workspace = true, optional = true }
fe2o3-hsaco.workspace = true
fe2o3-hsaco-finalize.workspace = true
fe2o3-host = { workspace = true, optional = true }
fe2o3-kernel-descriptor.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-kir-sim-cli.workspace = true
fe2o3-process-identity.workspace = true
fe2o3-rustc-invocation.workspace = true
fe2o3-scalar-gemm-v1 = { path = "../../examples/scalar_gemm_v1", optional = true }
fe2o3-verifier.workspace = true
fe2o3-worker-v2-bundle.workspace = true
fe2o3-worker-v3-authority = { workspace = true, optional = true }
libc.workspace = true
reserved-fe2o3-symbols.workspace = true
rustix = { workspace = true, features = ["process"] }
serde_json = "1"
sha2.workspace = true
syn = { workspace = true, features = ["visit"] }

[dev-dependencies]
fe2o3-amd-target.workspace = true
fe2o3-device.workspace = true
rmpv = { version = "1.3.1", default-features = false }

[[bin]]
name = "cargo-fe2o3"
path = "src/main.rs"

[[bin]]
name = "fe2o3-rustc-wrapper"
path = "src/bin/fe2o3-rustc-wrapper.rs"

[[bin]]
name = "cargo-fe2o3-worker-v2-fixture"
path = "tests/fixtures/worker_v2_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-envelope-input-fixture"
path = "tests/fixtures/envelope_input_fixture.rs"
test = false
bench = false

[[bin]]
name = "fe2o3-worker-v2-hsaco-fixture"
path = "../fe2o3-hsaco-finalize/tests/fixtures/worker_v2_hsaco_fixture.rs"
test = false
bench = false
required-features = ["worker-v3-envelope-integration-test-only"]

[[bin]]
name = "cargo-fe2o3-cargo-fixture"
path = "tests/fixtures/cargo_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-release-cargo-fixture"
path = "tests/fixtures/release_cargo_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-rustc-fixture"
path = "tests/fixtures/rustc_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-release-rustc-fixture"
path = "tests/fixtures/release_rustc_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-build-script-fixture"
path = "tests/fixtures/build_script_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-runner-app-fixture"
path = "tests/fixtures/runner_app_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-runner-chain-fixture"
path = "tests/fixtures/runner_chain_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-host-consumer-input-fixture"
path = "tests/fixtures/host_consumer_input_fixture.rs"
test = false
bench = false

[[bin]]
name = "cargo-fe2o3-host-consumer-app-fixture"
path = "tests/fixtures/host_consumer_app_fixture.rs"
required-features = ["host-consumer-fixture"]
test = false
bench = false
