[package]
name = "fe2o3-kernel-analysis"
version = "0.1.0"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conservative kernel IR and authenticated physical-machine analyses for fe2o3"

[features]
default = ["authenticated-machine-effect"]
authenticated-machine-effect = [
    "gfx942-fill-model",
    "dep:fe2o3-artifact-transaction",
    "dep:rustc_apfloat",
    "dep:rustix",
    "dep:sha2",
]
gfx942-fill-model = ["dep:fe2o3-hsaco"]

[dependencies]
fe2o3-artifact-transaction = { workspace = true, optional = true }
fe2o3-hsaco = { workspace = true, optional = true }
fe2o3-kernel-ir.workspace = true
fe2o3-mir-model.workspace = true
sha2 = { workspace = true, optional = true }
rustix = { workspace = true, features = ["process", "thread"], optional = true }
rustc_apfloat = { workspace = true, optional = true }

[lib]
name = "fe2o3_kernel_analysis"

[[example]]
name = "extract-native-fill-fixture"
path = "examples/extract-native-fill-fixture.rs"
required-features = ["authenticated-machine-effect"]

[dev-dependencies]
rmpv = { version = "1.3.1", default-features = false }

[[bin]]
name = "fe2o3-machine-effect-worker-fixture"
path = "tests/fixtures/machine_effect_worker_fixture.rs"
test = false
bench = false
required-features = ["authenticated-machine-effect"]

[[bin]]
name = "fe2o3-machine-effect-worker-substitute-fixture"
path = "tests/fixtures/machine_effect_worker_substitute_fixture.rs"
test = false
bench = false
required-features = ["authenticated-machine-effect"]

[[test]]
name = "authenticated_machine_effect"
path = "tests/authenticated_machine_effect.rs"
required-features = ["authenticated-machine-effect"]

[[test]]
name = "gfx942_scalar_f32_recurrence"
path = "tests/gfx942_scalar_f32_recurrence.rs"
required-features = ["authenticated-machine-effect"]

[[test]]
name = "physical_machine_effect"
path = "tests/physical_machine_effect.rs"
required-features = ["authenticated-machine-effect"]

[lints.rust]
unsafe_code = "deny"
