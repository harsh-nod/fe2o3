[package]
name = "fe2o3-kernel-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conservative kernel IR and authenticated physical-machine analyses for fe2o3"

[features]
default = ["authenticated-machine-effect", "pliron-analysis"]
authenticated-machine-effect = ["dep:fe2o3-artifact-transaction", "dep:rustix", "dep:sha2"]
pliron-analysis = ["dep:dialect-gpu", "dep:dialect-kernel", "dep:dialect-proof", "dep:fe2o3-pliron-owner-core", "dep:pliron", "dep:sha2"]

[dependencies]
dialect-gpu = { workspace = true, optional = true }
dialect-kernel = { workspace = true, optional = true }
dialect-proof = { workspace = true, optional = true }
fe2o3-artifact-transaction = { workspace = true, optional = true }
fe2o3-kernel-ir.workspace = true
fe2o3-pliron-owner-core = { workspace = true, optional = true }
pliron = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rustix = { workspace = true, features = ["process", "thread"], optional = true }

[lib]
name = "fe2o3_kernel_analysis"

[[bin]]
name = "fe2o3-machine-effect-worker-fixture"
path = "tests/fixtures/machine_effect_worker_fixture.rs"
test = false
bench = false
required-features = ["authenticated-machine-effect"]

[[bin]]
name = "fe2o3-machine-effect-worker-substitute-fixture"
path = "tests/fixtures/machine_effect_worker_substitute_fixture.rs"
test = false
bench = false
required-features = ["authenticated-machine-effect"]

[lints.rust]
unsafe_code = "deny"
