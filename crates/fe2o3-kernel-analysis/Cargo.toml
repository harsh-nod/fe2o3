[package]
name = "fe2o3-kernel-analysis"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Conservative kernel IR and bounded machine-effect analyses for fe2o3"

[dependencies]
dialect-kernel.workspace = true
fe2o3-kernel-ir.workspace = true
pliron.workspace = true
sha2.workspace = true
rustix = { workspace = true, features = ["process", "thread"] }

[lib]
name = "fe2o3_kernel_analysis"

[[bin]]
name = "fe2o3-machine-effect-worker-fixture"
path = "tests/fixtures/machine_effect_worker_fixture.rs"
test = false
bench = false

[[bin]]
name = "fe2o3-machine-effect-worker-substitute-fixture"
path = "tests/fixtures/machine_effect_worker_substitute_fixture.rs"
test = false
bench = false

[lints.rust]
unsafe_code = "deny"
