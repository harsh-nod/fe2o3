[package]
name = "fe2o3-hsaco-finalize"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded post-link canonical descriptor finalization for fe2o3 HSACOs."
publish = false

[lib]
name = "fe2o3_hsaco_finalize"

[dependencies]
dialect-amdgcn.workspace = true
fe2o3-artifact-transaction.workspace = true
fe2o3-compiler-ffi.workspace = true
fe2o3-general-gemm-compiler.workspace = true
fe2o3-hsaco.workspace = true
fe2o3-kernel-descriptor.workspace = true
fe2o3-kernel-ir.workspace = true
fe2o3-llvm-handoff.workspace = true
fe2o3-llvm-text.workspace = true
fe2o3-verifier.workspace = true
object = { version = "0.39.1", default-features = false, features = ["elf", "read_core"] }
reserved-fe2o3-symbols.workspace = true
rustix = { workspace = true, features = ["process"] }
sha2.workspace = true

[[bin]]
name = "fe2o3-worker-executor-fixture"
path = "tests/fixtures/worker_executor_fixture.rs"
test = false
bench = false

[[bin]]
name = "fe2o3-worker-v2-hsaco-fixture"
path = "tests/fixtures/worker_v2_hsaco_fixture.rs"
test = false
bench = false

[dev-dependencies]
fe2o3-compiler-api.workspace = true
rmpv = { version = "1.3.1", default-features = false }
trybuild = "1"
