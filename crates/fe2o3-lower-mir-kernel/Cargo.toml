[package]
name = "fe2o3-lower-mir-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded detached MIR-to-kernel Pliron lowering service for fe2o3."
readme = "README.md"
publish = false

[dependencies]
dialect-gpu.workspace = true
dialect-kernel.workspace = true
dialect-mir = { workspace = true, features = ["pliron"] }
fe2o3-kernel-ir.workspace = true
fe2o3-mir-model.workspace = true
fe2o3-pliron.workspace = true
pliron.workspace = true
sha2.workspace = true

[dev-dependencies]
dialect-amdgcn.workspace = true
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["fast", "zeroize"] }
fe2o3-amd-target.workspace = true
fe2o3-amdgcn-model.workspace = true
fe2o3-functional-proof = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-kernel-analysis.workspace = true
fe2o3-kir-sim.workspace = true
fe2o3-pliron = { workspace = true, features = ["internal-proof-staging"] }
fe2o3-proof-contracts.workspace = true
