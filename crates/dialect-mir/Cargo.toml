[package]
name = "dialect-mir"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MIR compatibility facade and feature-gated Pliron dialect shell for fe2o3."

[lib]
name = "dialect_mir"

[features]
default = []
pliron = ["dep:fe2o3-pliron", "dep:pliron"]

[dependencies]
fe2o3-mir-model.workspace = true
fe2o3-pliron = { workspace = true, optional = true }
pliron = { workspace = true, optional = true }

[dev-dependencies]
fe2o3-compiler-ffi.workspace = true
serde_json = "1"
