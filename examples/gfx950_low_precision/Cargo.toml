[package]
name = "fe2o3-gfx950-low-precision"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
rust-version = "1.94"
publish = false

[workspace]
members = []
resolver = "3"

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }

[target.'cfg(not(target_arch = "amdgpu"))'.dependencies]
fe2o3-host = { path = "../../crates/fe2o3-host" }

[lib]
name = "fe2o3_gfx950_low_precision"
path = "src/lib.rs"
