[package]
name = "fe2o3-row-softmax-v1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
rust-version = "1.94"
publish = false

[features]
protected-hardware = [
    "dep:fe2o3-artifact-transaction",
    "dep:fe2o3-compiler-ffi",
    "dep:fe2o3-core",
    "dep:fe2o3-host",
    "dep:fe2o3-hsa-runtime",
    "dep:fe2o3-hsaco",
    "dep:fe2o3-hsaco-finalize",
    "dep:fe2o3-verifier",
    "dep:sha2",
]

[dependencies]
fe2o3-artifact-transaction = { path = "../../crates/fe2o3-artifact-transaction", optional = true }
fe2o3-compiler-ffi = { path = "../../crates/fe2o3-compiler-ffi", optional = true }
fe2o3-core = { path = "../../crates/fe2o3-core", optional = true }
fe2o3-host = { path = "../../crates/fe2o3-host", optional = true }
fe2o3-hsa-runtime = { path = "../../crates/fe2o3-hsa-runtime", optional = true }
fe2o3-hsaco = { path = "../../crates/fe2o3-hsaco", optional = true }
fe2o3-hsaco-finalize = { path = "../../crates/fe2o3-hsaco-finalize", optional = true }
fe2o3-verifier = { path = "../../crates/fe2o3-verifier", optional = true }
sha2 = { version = "0.11.0", optional = true }

# Keep this proof example independently testable until a row-softmax compiler
# and runtime vertical slice exists.
[workspace]

[dev-dependencies]
sha2 = "0.11.0"

[lib]
name = "fe2o3_row_softmax_v1"
path = "src/lib.rs"

[[test]]
name = "protected_hardware"
path = "tests/protected_hardware.rs"
required-features = ["protected-hardware"]
