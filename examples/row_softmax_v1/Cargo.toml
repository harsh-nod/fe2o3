[package]
name = "fe2o3-row-softmax-v1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/harsh-nod/fe2o3"
rust-version = "1.94"
publish = false

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }
fe2o3-host = { path = "../../crates/fe2o3-host" }
quote = "1"
sha2 = "0.11.0"
syn = { version = "2", features = ["full"] }

# Keep this proof example independently testable until a row-softmax compiler
# and runtime vertical slice exists.
[workspace]

[lib]
name = "fe2o3_row_softmax_v1"
path = "src/lib.rs"
