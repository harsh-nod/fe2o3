[package]
name = "fe2o3-tiled-gemm-v1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
rust-version = "1.94"
publish = false

# This example is intentionally standalone until its compiler and runtime
# vertical slice is ready to join the root workspace.
[workspace]

[features]
# Ordinary Cargo exercises an authority-free ABI marker and the host-side
# contract. cargo-fe2o3 production fixtures compile `src/kernel.rs` directly;
# selecting that source through this manifest requires --no-default-features.
default = ["host-contract"]
host-contract = []

[dependencies]
fe2o3-amd-target = { path = "../../crates/fe2o3-amd-target" }
fe2o3-compiler-api = { path = "../../crates/fe2o3-compiler-api" }
fe2o3-compiler-driver = { path = "../../crates/fe2o3-compiler-driver" }
fe2o3-device = { path = "../../crates/fe2o3-device" }
fe2o3-host = { path = "../../crates/fe2o3-host" }
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[lib]
name = "fe2o3_tiled_gemm_v1"
path = "src/lib.rs"
