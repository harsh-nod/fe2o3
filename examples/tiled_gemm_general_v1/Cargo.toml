[package]
name = "fe2o3-tiled-gemm-general-v1"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/fe2o3-gpu/fe2o3"
rust-version = "1.94"
publish = false

# This source contract remains standalone until general MIR import, proof
# discharge, lowering, and protected execution are joined end to end.
[workspace]

[dependencies]
fe2o3-device = { path = "../../crates/fe2o3-device" }
fe2o3-host = { path = "../../crates/fe2o3-host" }

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }

[lib]
name = "fe2o3_tiled_gemm_general_v1"
path = "src/lib.rs"
